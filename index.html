<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ 给你 ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1, #fbc2eb);
    background-size: 400% 400%;
    animation: gradient 12s ease infinite;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  @keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .container {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
  }
  .heart-btn {
    width: clamp(120px, 30vw, 180px);
    height: clamp(120px, 30vw, 180px);
    border: none;
    background: radial-gradient(circle at 30% 30%, #ff5e7a, #e0244e);
    border-radius: 50%;
    color: #fff;
    font-size: clamp(28px, 6vw, 44px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 40px rgba(224, 36, 78, .5);
    transition: transform .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .heart-btn:active { transform: scale(.92); }
  .words {
    color: #fff;
    font-size: clamp(20px, 4.5vw, 32px);
    font-weight: bold;
    text-shadow: 0 2px 15px rgba(0,0,0,.25);
    height: 2.5em;
    line-height: 1.3;
    text-align: center;
    padding: 0 16px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s, transform .5s;
  }
  .words.show { opacity: 1; transform: translateY(0); }
  .heart {
    position: fixed;
    font-size: 22px;
    pointer-events: none;
    z-index: 99;
    user-select: none;
  }
  .title {
    position: absolute;
    top: 8%;
    color: #fff;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: bold;
    text-shadow: 0 2px 20px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div class="container">
  <div class="title">🌸 送你一份小惊喜 🌸</div>
  <button class="heart-btn" id="btn">点我 💗</button>
  <div class="words" id="words"></div>
</div>

<script>
const words = [
  "你是我最甜的糖果 🍬", "遇见你真的很幸运 ✨", "你笑起来像星星 �",
  "你是我所有的温柔 ☁️", "有你在身边真好 🏠", "你是我心里的光 🌟",
  "爱你就像西瓜的顶部，甜到最中间 🍉", "我的世界里，你是唯一的甜 🍯",
  "希望全世界都是我你你你 💌", "和你在一起的每一天都是情人节 💕",
  "宝贝，今天也要开开心心哦 🌈", "你的笑是我见过最美的风景 �",
  "不管多远，我都会奔向你 🏃", "你就是我生命里最幸运的事 🍀",
  "往后余生，olicies都是你 ♾️", "你值得拥有世界上所有的喜欢 💝"
];

const btn = document.getElementById('btn');
const wordsEl = document.getElementById('words');
const symbols = ['💗','💖','💕','💓','✨','🌸','💘'];

let lastIdx = -1;
let timer = null;

function showWord() {
  let i;
  do { i = Math.floor(Math.random() * words.length); } while (i === lastIdx);
  lastIdx = i;
  wordsEl.classList.remove('show');
  setTimeout(() => {
    wordsEl.textContent = words[i];
    wordsEl.classList.add('show');
  }, 300);
  clearTimeout(timer);
  timer = setTimeout(() => wordsEl.classList.remove('show'), 3000);
}

function flyHearts(x, y, count = 12) {
  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = x + 'px';
    h.style.top = y + 'px';
    h.style.fontSize = (16 + Math.random() * 28) + 'px';
    document.body.appendChild(h);

    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 200;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 60;
    const duration = 1200 + Math.random() * 800;

    h.style.transition = `all ${duration}ms ease-out`;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      h.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*720-360}deg) scale(${0.3 + Math.random()*0.5})`;
      h.style.opacity = '0';
    }));
    setTimeout(() => h.remove(), duration + 100);
  }
}

function handleClick(e) {
  const rect = btn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  flyHearts(cx, cy, 16);
  showWord();
}

btn.addEventListener('click', handleClick);
btn.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleClick(e);
}, { passive: false });

// 页面加载时来一点初始小心心
setTimeout(() => {
  const rect = btn.getBoundingClientRect();
  flyHearts(rect.left + rect.width/2, rect.top + rect.height/2, 8);
}, 500);
</script>
</body>
</html>
