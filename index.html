<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>💕 致我最爱的你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'STKaiti', 'KaiTi', 'Microsoft YaHei', serif;
    overflow: hidden;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #fbc2eb 50%, #a18cd1 75%, #fbc2eb 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    height: 100vh;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><text y="20" font-size="20">💕</text></svg>'), auto;
  }
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .phrase-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
  .phrase-row { position: absolute; white-space: nowrap; font-size: 18px; color: rgba(255, 255, 255, 0.25); text-shadow: 0 0 10px rgba(255, 105, 180, 0.5); letter-spacing: 8px; }
  .phrase-row.left { animation: scrollLeft 60s linear infinite; }
  .phrase-row.right { animation: scrollRight 70s linear infinite; }
  @keyframes scrollLeft { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
  @keyframes scrollRight { from { transform: translateX(-100%); } to { transform: translateX(100vw); } }

  .heart { position: fixed; top: -50px; font-size: 24px; pointer-events: none; z-index: 2; animation: fall linear infinite; opacity: 0.7; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  .glow { position: fixed; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,182,193,0.4) 0%, transparent 70%); pointer-events: none; z-index: 3; transform: translate(-50%, -50%); transition: all 0.3s ease; }

  .main-content { position: relative; z-index: 10; height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .card {
    background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 30px;
    padding: 60px 80px; max-width: 700px; min-height: 400px;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3); text-align: center; position: relative; overflow: hidden;
  }
  .card::before { content: '💕'; position: absolute; top: 20px; left: 30px; font-size: 30px; animation: pulse 2s ease-in-out infinite; }
  .card::after { content: '💕'; position: absolute; bottom: 20px; right: 30px; font-size: 30px; animation: pulse 2s ease-in-out infinite 1s; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }

  .card-content { font-size: 28px; color: #fff; text-shadow: 0 2px 10px rgba(255, 105, 180, 0.6); line-height: 2; letter-spacing: 3px; white-space: pre-wrap; }
  .cursor-blink { display: inline-block; width: 3px; height: 28px; background: #fff; margin-left: 5px; animation: blink 1s infinite; vertical-align: middle; }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  .nav-btns { margin-top: 30px; display: flex; gap: 20px; z-index: 10; }
  .nav-btn {
    background: rgba(255, 255, 255, 0.3); border: 2px solid rgba(255, 255, 255, 0.6); color: #fff;
    padding: 12px 30px; border-radius: 30px; font-size: 16px; cursor: pointer; transition: all 0.3s;
    backdrop-filter: blur(10px); font-family: inherit; letter-spacing: 2px;
  }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.5); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4); }
  .page-indicator { color: #fff; font-size: 14px; margin-top: 15px; letter-spacing: 3px; opacity: 0.8; }

  .click-heart { position: fixed; pointer-events: none; font-size: 24px; z-index: 100; animation: clickHeart 1s ease-out forwards; }
  @keyframes clickHeart { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(2); opacity: 0; } }

  .title {
    position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 32px; text-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
    z-index: 10; letter-spacing: 5px; animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow { 0%, 100% { text-shadow: 0 0 20px rgba(255, 105, 180, 0.8); } 50% { text-shadow: 0 0 40px rgba(255, 105, 180, 1), 0 0 60px rgba(255, 20, 147, 0.6); } }

  .music-control {
    position: fixed; bottom: 30px; right: 30px; z-index: 1000;
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.6);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 24px; color: #fff;
    box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4); transition: all 0.3s;
  }
  .music-control:hover { transform: scale(1.1); background: rgba(255, 255, 255, 0.5); }
  .music-control.playing { animation: rotateDisc 4s linear infinite; }
  @keyframes rotateDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  .play-hint {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); z-index: 2000;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; font-size: 24px; letter-spacing: 5px;
    cursor: pointer; backdrop-filter: blur(5px);
  }
  .play-hint small { font-size: 14px; margin-top: 10px; opacity: 0.7; }

  /* 错误提示 */
  .error-msg {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.9); padding: 30px; border-radius: 20px;
    color: #ff1493; text-align: center; z-index: 3000; display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>

<div class="play-hint" id="playHint" onclick="playMusic()">
  <div>💕 点击屏幕任意位置，开启浪漫之旅 💕</div>
  <small>（同时播放背景音乐）</small>
</div>

<div class="music-control" id="musicBtn" onclick="toggleMusic()">🎵</div>
<div class="title">💕 致我最爱的你 💕</div>
<div class="phrase-layer" id="phraseLayer"></div>
<div class="glow" id="glow"></div>

<div class="main-content">
  <div class="card">
    <div class="card-content">
      <span id="typedText"></span><span class="cursor-blink"></span>
    </div>
  </div>
  <div class="nav-btns">
    <button class="nav-btn" onclick="prevPage()">◀ 上一页</button>
    <button class="nav-btn" onclick="nextPage()">下一页 ▶</button>
  </div>
  <div class="page-indicator" id="pageIndicator">加载中...</div>
</div>

<div class="error-msg" id="errorMsg">
  <h3>💔 哎呀，文件没找到</h3>
  <p style="margin-top:10px; font-size:14px; color:#666;">
    请确保 <b>phrases.txt</b> 和 <b>content.txt</b> 在同目录下<br>
    并且你是通过 <b>Python 服务器</b> 访问的，而不是直接双击打开 HTML 文件。
  </p>
</div>

<script>
let phrases = [];
let pages = [];
let currentPage = 0;
let typingTimer = null;
let isMusicPlaying = false;

const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
const playHint = document.getElementById('playHint');

function playMusic() {
  bgm.play().then(() => {
    isMusicPlaying = true;
    musicBtn.classList.add('playing');
    musicBtn.textContent = '🎶';
    playHint.style.display = 'none';
  }).catch(e => console.log("等待用户交互"));
}

function toggleMusic() {
  if (isMusicPlaying) { bgm.pause(); musicBtn.classList.remove('playing'); musicBtn.textContent = '🔇'; } 
  else { bgm.play(); musicBtn.classList.add('playing'); musicBtn.textContent = '🎶'; }
  isMusicPlaying = !isMusicPlaying;
}

const glow = document.getElementById('glow');
document.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });

document.addEventListener('click', (e) => {
  if (!e.target.closest('.music-control') && !e.target.closest('.nav-btn')) {
    const hearts = ['💕', '💖', '💗', '💓', '💘', '❤️', '🌸', '🌹'];
    const heart = document.createElement('div');
    heart.className = 'click-heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = e.clientX + 'px'; heart.style.top = e.clientY + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1000);
  }
  if (!isMusicPlaying) playMusic();
});

function createFallingHeart() {
  const hearts = ['💕', '💖', '💗', '🌸', '🌹', '✨', '💫'];
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
  heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
  heart.style.opacity = Math.random() * 0.5 + 0.3;
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}
setInterval(createFallingHeart, 400);

// 🚀 自动读取文件逻辑
async function init() {
  try {
    // 并行请求两个文件
    const [res1, res2] = await Promise.all([
      fetch('phrases.txt'),
      fetch('content.txt')
    ]);

    if (!res1.ok || !res2.ok) throw new Error("文件未找到");

    const text1 = await res1.text();
    const text2 = await res2.text();

    phrases = text1.split('\n').map(s => s.trim()).filter(s => s);
    pages = text2.split('---').map(s => s.trim()).filter(s => s);

    renderPhrases();
    showPage(0);
  } catch (error) {
    console.error(error);
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('pageIndicator').textContent = "读取失败";
  }
}

function renderPhrases() {
  const layer = document.getElementById('phraseLayer');
  layer.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const row = document.createElement('div');
    row.className = 'phrase-row ' + (i % 2 === 0 ? 'left' : 'right');
    row.style.top = (i * 7) + '%';
    row.style.animationDelay = -(Math.random() * 60) + 's';
    row.style.fontSize = (Math.random() * 8 + 14) + 'px';
    const text = phrases[i % phrases.length] || '';
    row.textContent = (text + '    ✿    ').repeat(8);
    layer.appendChild(row);
  }
}

function showPage(index) {
  if (index < 0 || index >= pages.length) return;
  currentPage = index;
  const text = pages[index];
  const typedText = document.getElementById('typedText');
  typedText.textContent = '';
  document.getElementById('pageIndicator').textContent = `第 ${index + 1} 页 / 共 ${pages.length} 页`;
  if (typingTimer) clearTimeout(typingTimer);
  let i = 0;
  function type() {
    if (i < text.length) { typedText.textContent += text.charAt(i); i++; typingTimer = setTimeout(type, 80); }
  }
  type();
}
function nextPage() { if (currentPage < pages.length - 1) showPage(currentPage + 1); }
function prevPage() { if (currentPage > 0) showPage(currentPage - 1); }
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') nextPage(); if (e.key === 'ArrowLeft') prevPage(); });

// 页面加载完成后自动执行
window.onload = init;
</script>
</body>
</html>
